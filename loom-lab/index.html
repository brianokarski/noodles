<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>LOOM LAB — cloth</title>
<style>
  :root{
    --ink:#f2f2f0; --bg:#0d0d0c; --panel:#141413; --line:#262624;
    --dim:#78786f; --accent:#d6ff3f;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden}
  body{
    background:var(--bg);color:var(--ink);
    font:400 11px/1.35 ui-monospace,"SF Mono",Menlo,monospace;letter-spacing:.03em;
    display:grid;grid-template-columns:250px 1fr;
    user-select:none;-webkit-user-select:none;
  }
  aside{border-right:1px solid var(--line);background:var(--panel);overflow-y:auto;display:flex;flex-direction:column}
  .brand{padding:13px 14px 11px;border-bottom:1px solid var(--line)}
  .brand h1{margin:0;font-size:12px;letter-spacing:.22em;font-weight:500}
  .brand p{margin:5px 0 0;color:var(--dim);font-size:9.5px}
  section{padding:12px 14px;border-bottom:1px solid var(--line)}
  section>h2{margin:0 0 10px;font-size:9px;letter-spacing:.24em;color:var(--dim);font-weight:500}

  .ctl{margin-bottom:12px}
  .ctl:last-child{margin-bottom:0}
  .ctl .top{display:flex;align-items:center;gap:6px;margin-bottom:5px}
  .ctl .chk{flex:none;width:12px;height:12px;border:1px solid #3a3a35;background:none;
    cursor:pointer;padding:0;border-radius:2px}
  .ctl .chk:hover{border-color:var(--dim)}
  .ctl .chk.on{background:var(--accent);border-color:var(--accent)}
  .ctl .lbl{flex:1;color:var(--dim);font-size:10px;cursor:ew-resize;padding:2px 0}
  .ctl .lbl:hover{color:var(--ink)}
  .ctl .box{display:flex;align-items:baseline;gap:2px;border:1px solid var(--line);
    background:#0d0d0c;padding:3px 5px;min-width:58px;justify-content:flex-end}
  .ctl .box:focus-within{border-color:var(--accent)}
  .ctl input{background:none;border:0;color:var(--ink);font:inherit;font-size:10.5px;
    text-align:right;width:40px;padding:0;font-variant-numeric:tabular-nums;outline:none}
  .ctl .u{color:var(--dim);font-size:9.5px}
  .ctl .track{position:relative;height:18px;cursor:ew-resize;touch-action:none}
  .ctl .track::before{content:'';position:absolute;left:0;right:0;top:8px;height:3px;
    background:#2c2c28;border-radius:2px}
  .ctl .fill{position:absolute;left:0;top:8px;height:3px;background:#4d5231;border-radius:2px}
  .ctl .knob{position:absolute;top:2px;width:12px;height:14px;margin-left:-6px;border-radius:3px;
    background:var(--ink)}
  .ctl .track:hover .knob,.ctl.live .knob{background:var(--accent)}

  .seg{display:grid;grid-auto-flow:column;border:1px solid var(--line)}
  .seg button{background:none;border:0;border-right:1px solid var(--line);color:var(--dim);
    font:inherit;font-size:9.5px;letter-spacing:.06em;padding:8px 2px;cursor:pointer;white-space:nowrap}
  .seg button:last-child{border-right:0}
  .seg button:hover{color:var(--ink)}
  .seg button.on{background:var(--ink);color:#0d0d0c}

  .cline{display:flex;align-items:center;gap:8px;margin-bottom:8px}
  .cline:last-child{margin-bottom:0}
  .cline b{font-weight:400;color:var(--dim);font-size:9.5px;width:44px}
  .sw{display:flex;gap:4px;flex-wrap:wrap;flex:1}
  .sw button{width:20px;height:20px;border-radius:50%;border:1px solid #33332f;padding:0;cursor:pointer}
  .sw button.on{box-shadow:0 0 0 1px var(--panel),0 0 0 2px var(--accent)}

  .acts{padding:12px 14px;display:grid;gap:6px}
  .acts button{background:none;border:1px solid var(--line);color:var(--ink);font:inherit;font-size:9.5px;
    letter-spacing:.13em;padding:9px;cursor:pointer;text-align:left}
  .acts button:hover{border-color:var(--ink)}
  .acts button.pri{background:var(--accent);color:#0d0d0c;border-color:var(--accent);font-weight:500}
  .acts .k{float:right;color:var(--dim)}
  .acts .pri .k{color:#0d0d0c;opacity:.55}
  footer{margin-top:auto;padding:12px 14px;color:var(--dim);font-size:9.5px;line-height:1.75;border-top:1px solid var(--line)}

  main{position:relative;overflow:hidden;background:#000}
  canvas#c{position:absolute;inset:0;width:100%;height:100%}
  .hud{position:absolute;left:12px;bottom:10px;color:#5e5e57;font-size:9.5px;letter-spacing:.12em;
    pointer-events:none;font-variant-numeric:tabular-nums}
</style>
</head>
<body>
<aside>
  <div class="brand">
    <h1>LOOM LAB</h1>
    <p>cloth study</p>
  </div>

  <section>
    <h2>STRUCTURE</h2>
    <div class="seg" id="str" style="margin-bottom:6px">
      <button data-s="plain" class="on">PLAIN</button>
      <button data-s="twill">TWILL</button>
      <button data-s="basket">BASKET</button>
    </div>
    <div class="seg" id="str2">
      <button data-s="herring">HERRING</button>
      <button data-s="satin">SATIN</button>
    </div>
  </section>

  <section>
    <h2>CLOTH</h2>
    <div class="ctls" data-keys="count,weight,tuck"></div>
  </section>

  <section>
    <h2>YARN</h2>
    <div class="ctls" data-keys="relief,tone"></div>
  </section>

  <section>
    <h2>COLOR</h2>
    <div class="cline"><b>WARP</b><div class="sw" data-slot="warp"></div></div>
    <div class="cline"><b>WEFT</b><div class="sw" data-slot="weft"></div></div>
  </section>

  <div class="acts">
    <button id="zoom">ZOOM IN / OUT <span class="k">Z</span></button>
    <button id="reset">RESET</button>
    <button id="expsvg">EXPORT SVG <span class="k">S</span></button>
    <button id="exppng" class="pri">EXPORT PNG <span class="k">E</span></button>
  </div>

  <footer>
    TUCK UNDER is how far each<br>
    thread reaches beneath its<br>
    crossing neighbours.<br>
    RELIEF is the round of the yarn<br>
    plus the shadow where it dives.
  </footer>
</aside>

<main>
  <canvas id="c"></canvas>
  <div class="hud" id="hud"></div>
</main>

<script>
(function(){
"use strict";
const cv=document.getElementById('c'),ctx=cv.getContext('2d'),hud=document.getElementById('hud');
const SWATCH=['#15171b','#ece7db','#b8603c','#6b2433','#6d7f6a','#44586a','#c49a4e','#f7f5ef'];

const SPEC={
  count:['threads across',6,160,1,'',0],
  weight:['yarn weight',30,130,1,'%',0],
  tuck:['tuck under',0,150,1,'%',0],
  relief:['relief',0,100,1,'%',0],
  tone:['thread tone',0,100,1,'%',0]
};
const DEF={count:34,weight:104,tuck:60,relief:45,tone:10};
const P=Object.assign({},DEF);
let colors={warp:'#15171b',weft:'#ece7db'};
let board={w:1200,h:1200};
let str='plain',zoomed=false;
let view={s:1,ox:0,oy:0},dpr=1,hist=[];

const snap=()=>{hist.push(JSON.stringify({P:P,colors:colors,str:str}));if(hist.length>60)hist.shift();};
function undo(){const h=hist.pop();if(!h)return;const o=JSON.parse(h);
  Object.assign(P,o.P);colors=o.colors;str=o.str;
  segOn('str','s',str);segOn('str2','s',str);syncAll();draw();}

/* ================= dials ================= */
const UI={};
function fmt(k,v){const d=SPEC[k][5];return d?v.toFixed(d):String(Math.round(v));}
function clampStep(k,v){
  const [,mn,mx,st]=SPEC[k];
  v=Math.max(mn,Math.min(mx,v));
  return +(Math.round(v/st)*st).toFixed(4);
}
function setVal(k,v,opts){
  const o=opts||{};
  const nv=clampStep(k,v);
  if(nv===P[k]&&!o.force) return;
  P[k]=nv;paintCtl(k);
  if(!o.silent) draw();
}
function paintCtl(k){
  const u=UI[k];if(!u)return;
  const [,mn,mx]=SPEC[k];
  const t=(P[k]-mn)/(mx-mn);
  u.fill.style.width=(t*100)+'%';
  u.knob.style.left=(t*100)+'%';
  if(document.activeElement!==u.input) u.input.value=fmt(k,P[k]);
}
let armed=true;
function snapOnce(){if(armed){snap();armed=false;}}
function buildCtl(k){
  const [label,mn,mx,st]=SPEC[k];
  const el=document.createElement('div');
  el.className='ctl';
  el.innerHTML=
    '<div class="top"><button class="chk" title="animate"></button>'+
    '<div class="lbl">'+label+'</div>'+
    '<div class="box"><input inputmode="decimal" spellcheck="false"><span class="u">'+SPEC[k][4]+'</span></div></div>'+
    '<div class="track"><div class="fill"></div><div class="knob"></div></div>';
  const input=el.querySelector('input'),track=el.querySelector('.track'),
        lbl=el.querySelector('.lbl');
  UI[k]={el:el,input:input,fill:el.querySelector('.fill'),knob:el.querySelector('.knob')};
  const factor=e=>e.shiftKey?0.1:(e.altKey?10:1);
  const commit=()=>{const n=parseFloat(input.value);
    if(isFinite(n)) setVal(k,n,{force:true}); paintCtl(k);};
  input.addEventListener('focus',()=>input.select());
  input.addEventListener('change',commit);
  input.addEventListener('blur',commit);
  input.addEventListener('keydown',e=>{
    if(e.key==='Enter'){commit();input.blur();e.preventDefault();}
    else if(e.key==='ArrowUp'||e.key==='ArrowDown'){
      e.preventDefault();
      snapOnce();setVal(k,P[k]+(e.key==='ArrowUp'?1:-1)*st*(e.shiftKey?10:1),{force:true});
    }else if(e.key==='Escape'){input.value=fmt(k,P[k]);input.blur();}
    e.stopPropagation();
  });
  track.addEventListener('pointerdown',e=>{
    e.preventDefault();track.setPointerCapture(e.pointerId);
    snapOnce();el.classList.add('live');
    const r=track.getBoundingClientRect();
    const fromX=x=>mn+((x-r.left)/r.width)*(mx-mn);
    let last=fromX(e.clientX);
    setVal(k,last,{force:true});
    const move=ev=>{
      const rawv=fromX(ev.clientX),f=factor(ev);
      if(f===1){setVal(k,rawv);last=rawv;}
      else{setVal(k,P[k]+(rawv-last)*f);last=rawv;}
    };
    const up=()=>{track.removeEventListener('pointermove',move);
      track.removeEventListener('pointerup',up);
      el.classList.remove('live');armed=true;};
    track.addEventListener('pointermove',move);
    track.addEventListener('pointerup',up);
  });
  lbl.addEventListener('pointerdown',e=>{
    e.preventDefault();lbl.setPointerCapture(e.pointerId);
    snapOnce();el.classList.add('live');
    let px=e.clientX,start=P[k],acc=0;
    const move=ev=>{acc+=(ev.clientX-px)*st*factor(ev);px=ev.clientX;setVal(k,start+acc);};
    const up=()=>{lbl.removeEventListener('pointermove',move);
      lbl.removeEventListener('pointerup',up);
      el.classList.remove('live');armed=true;};
    lbl.addEventListener('pointermove',move);
    lbl.addEventListener('pointerup',up);
  });
  el.addEventListener('wheel',e=>{
    e.preventDefault();snapOnce();
    setVal(k,P[k]+(e.deltaY<0?1:-1)*st*(e.shiftKey?10:1));
  },{passive:false});
  el.querySelector('.chk').onclick=function(){
    if(anim[k]){delete anim[k];this.classList.remove('on');}
    else{const [,a,b]=SPEC[k];anim[k]={u:(P[k]-a)/(b-a),dir:1};
      this.classList.add('on');startAnim();}
  };
  paintCtl(k);
  return el;
}
const anim={};
let rafId=null,lastTs=0;
function startAnim(){if(rafId==null){lastTs=0;rafId=requestAnimationFrame(tick);}}
function tick(ts){
  if(!lastTs) lastTs=ts;
  const dt=Math.min(.1,(ts-lastTs)/1000);lastTs=ts;
  const keys=Object.keys(anim);
  if(!keys.length){rafId=null;return;}
  keys.forEach(k=>{
    const a=anim[k],[,mn,mx]=SPEC[k];
    a.u+=(dt/5)*a.dir;
    if(a.u>1){a.u=2-a.u;a.dir=-1;}
    if(a.u<0){a.u=-a.u;a.dir=1;}
    setVal(k,mn+a.u*(mx-mn),{force:true,silent:true});
  });
  draw();
  rafId=requestAnimationFrame(tick);
}
document.querySelectorAll('.ctls').forEach(host=>{
  host.dataset.keys.split(',').forEach(k=>host.appendChild(buildCtl(k.trim())));
});
function syncAll(){Object.keys(SPEC).forEach(paintCtl);
  document.querySelectorAll('.sw').forEach(g=>{
    [...g.children].forEach(b=>b.classList.toggle('on',b.dataset.c===colors[g.dataset.slot]));});}

/* ================= structure ================= */
function hash1(i,seed){
  let h=(i|0)*374761393+(seed|0)*668265263;
  h=(h^(h>>>13))>>>0;h=Math.imul(h,1274126177)>>>0;
  return ((h^(h>>>16))>>>0)/4294967296;
}
const md=(a,n)=>((a%n)+n)%n;
/* true = the warp thread passes over this crossing */
function warpUp(i,j){
  if(str==='plain')  return md(i+j,2)===0;
  if(str==='twill')  return md(i-j,4)<2;
  if(str==='basket') return md(Math.floor(i/2)+Math.floor(j/2),2)===0;
  if(str==='satin')  return md(i-2*j,5)<1;
  if(str==='herring'){
    const dir=md(Math.floor(i/6),2)?1:-1;
    return md(i+dir*j,4)<2;
  }
  return md(i+j,2)===0;
}

/* ================= cloth ================= */
function hexRGB(h){return [parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];}
function mulRGB(c,f){
  const q=v=>Math.max(0,Math.min(255,Math.round(v*f)));
  return [q(c[0]),q(c[1]),q(c[2])];
}
const rgbStr=c=>'rgb('+Math.round(c[0])+','+Math.round(c[1])+','+Math.round(c[2])+')';
/* lerp toward white / black, so a near-black yarn still shows its round */
const mixW=(c,t)=>[c[0]+(255-c[0])*t,c[1]+(255-c[1])*t,c[2]+(255-c[2])*t];
const mixB=(c,t)=>[c[0]*(1-t),c[1]*(1-t),c[2]*(1-t)];

/* Threads are continuous. Every warp end runs the full height, every pick the
   full width; only the crossings change which one is on the surface. A surface
   crossing is drawn as a lens that pinches where the yarn dives under, so the
   crossing thread reads as cutting across it. */
function buildCloth(){
  const N=Math.max(2,Math.round(P.count));
  const cell=board.w/N;
  const M=Math.max(2,Math.round(board.h/cell));
  const up=new Uint8Array(N*M);
  for(let j=0;j<M;j++) for(let i=0;i<N;i++) up[j*N+i]=warpUp(i,j)?1:0;

  const wd=cell*(P.weight/100);
  const tk=P.tuck/100;
  const warpRGB=hexRGB(colors.warp),weftRGB=hexRGB(colors.weft);
  const tn=P.tone/100;
  const warpTone=new Array(N),weftTone=new Array(M);
  for(let i=0;i<N;i++) warpTone[i]=mulRGB(warpRGB,1+(hash1(i,3)-0.5)*tn*0.5);
  for(let j=0;j<M;j++) weftTone[j]=mulRGB(weftRGB,1+(hash1(j,91)-0.5)*tn*0.5);

  /* the surface crossings, merged into floats. each one reaches past its
     crossing thread so neighbouring crossings butt up under each other */
  const ext=(cell-wd)/2+wd*0.12*tk;
  const lens=[];
  for(let i=0;i<N;i++){
    let j=0;
    while(j<M){
      if(!up[j*N+i]){j++;continue;}
      let j2=j;
      while(j2+1<M&&up[(j2+1)*N+i]) j2++;
      lens.push({cx:i*cell+cell/2,a:j*cell-ext,b:(j2+1)*cell+ext,
                 hw:wd/2,rgb:warpTone[i],vert:true});
      j=j2+1;
    }
  }
  for(let j=0;j<M;j++){
    let i=0;
    while(i<N){
      if(up[j*N+i]){i++;continue;}
      let i2=i;
      while(i2+1<N&&!up[j*N+i2+1]) i2++;
      lens.push({cx:j*cell+cell/2,a:i*cell-ext,b:(i2+1)*cell+ext,
                 hw:wd/2,rgb:weftTone[j],vert:false});
      i=i2+1;
    }
  }
  return {lens:lens,N:N,M:M,cell:cell,wd:wd,ext:ext,tk:tk};
}

/* ================= yarn paint ================= */
const gradCache=new WeakMap();
function cacheFor(g){let m=gradCache.get(g);if(!m){m=new Map();gradCache.set(g,m);}return m;}
/* across the yarn: shaded edge, highlight, base, deeper shade = a cylinder */
function roundGrad(g,f){
  const m=cacheFor(g),r=P.relief/100;
  const key='r'+f.rgb.join(',')+'|'+(f.vert?f.w:f.h).toFixed(2)+'|'+f.vert+'|'+r.toFixed(2);
  let gr=m.get(key);
  if(!gr){
    const L=f.vert?f.w:f.h;
    gr=f.vert?g.createLinearGradient(0,0,L,0):g.createLinearGradient(0,0,0,L);
    gr.addColorStop(0,   rgbStr(mixB(f.rgb,0.17*r)));
    gr.addColorStop(0.30,rgbStr(mixW(f.rgb,0.14*r)));
    gr.addColorStop(0.62,rgbStr(f.rgb));
    gr.addColorStop(1,   rgbStr(mixB(f.rgb,0.32*r)));
    m.set(key,gr);
  }
  return gr;
}
/* along the yarn: dark where it dives beneath the crossing thread */
function diveGrad(g,vert,W,L,tk){
  const m=cacheFor(g),r=P.relief/100;
  const pad=Math.min(0.45,W*0.85/L);
  const key='d'+L.toFixed(2)+'|'+vert+'|'+pad.toFixed(3)+'|'+r.toFixed(2)+'|'+tk.toFixed(2);
  let gr=m.get(key);
  if(!gr){
    gr=vert?g.createLinearGradient(0,0,0,L):g.createLinearGradient(0,0,L,0);
    const a=(0.30*r*(0.35+0.65*tk)).toFixed(3);
    gr.addColorStop(0,'rgba(0,0,0,'+a+')');
    gr.addColorStop(pad,'rgba(0,0,0,0)');
    gr.addColorStop(1-pad,'rgba(0,0,0,0)');
    gr.addColorStop(1,'rgba(0,0,0,'+a+')');
    m.set(key,gr);
  }
  return gr;
}
/* a float in local space: full width in the middle, pinched at both ends
   where the yarn dives under the crossing thread */
function lensPath(g,vert,W,L,tk){
  const hw=W/2,ew=hw*(1-0.20*tk),c=hw;
  const k=Math.min(L*0.14,hw*0.9);
  g.beginPath();
  if(vert){
    g.moveTo(c-ew,0);
    g.bezierCurveTo(c-hw,k,c-hw,L-k,c-ew,L);
    g.lineTo(c+ew,L);
    g.bezierCurveTo(c+hw,L-k,c+hw,k,c+ew,0);
  }else{
    g.moveTo(0,c-ew);
    g.bezierCurveTo(k,c-hw,L-k,c-hw,L,c-ew);
    g.lineTo(L,c+ew);
    g.bezierCurveTo(L-k,c+hw,k,c+hw,0,c+ew);
  }
  g.closePath();
}
function drawLens(g,list,cell,tk){
  const r=P.relief/100,blur=r>0&&cell>7;
  for(let k=0;k<list.length;k++){
    const f=list[k];
    const L=f.b-f.a,W=f.hw*2;
    g.save();
    g.translate(f.vert?f.cx-f.hw:f.a,f.vert?f.a:f.cx-f.hw);
    if(blur){
      g.shadowColor='rgba(0,0,0,'+(0.22*r).toFixed(3)+')';
      g.shadowBlur=cell*0.11;
      g.shadowOffsetX=cell*0.02;g.shadowOffsetY=cell*0.025;
    }
    lensPath(g,f.vert,W,L,tk);
    g.fillStyle=r>0?roundGrad(g,{rgb:f.rgb,w:f.vert?W:L,h:f.vert?L:W,vert:f.vert})
                   :rgbStr(f.rgb);
    g.fill();
    if(r>0){
      g.shadowColor='transparent';g.shadowBlur=0;
      g.fillStyle=diveGrad(g,f.vert,W,L,tk);
      g.fill();                       /* dark where it dives under */
    }
    g.restore();
  }
}
function renderContent(g){
  /* the interior of the cloth: what little shows down in the crevices is the
     two yarns in shadow, never a background colour */
  const a=hexRGB(colors.warp),b=hexRGB(colors.weft);
  g.fillStyle=rgbStr(mixB([(a[0]+b[0])/2,(a[1]+b[1])/2,(a[2]+b[2])/2],0.72));
  g.fillRect(0,0,board.w,board.h);
  const cl=buildCloth();
  drawLens(g,cl.lens,cl.cell,cl.tk);
  return cl;
}

/* ================= view ================= */
function fit(){
  dpr=Math.min(window.devicePixelRatio||1,2);
  const r=cv.parentElement.getBoundingClientRect();
  cv.width=Math.round(r.width*dpr);cv.height=Math.round(r.height*dpr);
  const pad=zoomed?-board.w*0.55:30;
  view.s=Math.min((r.width-pad*2)/board.w,(r.height-pad*2)/board.h);
  view.ox=(r.width-board.w*view.s)/2;view.oy=(r.height-board.h*view.s)/2;
  draw();
}
new ResizeObserver(fit).observe(document.querySelector('main'));
function draw(){
  const W=cv.width/dpr,H=cv.height/dpr;
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);
  ctx.save();ctx.translate(view.ox,view.oy);ctx.scale(view.s,view.s);
  ctx.beginPath();ctx.rect(0,0,board.w,board.h);ctx.clip();
  const cl=renderContent(ctx);
  ctx.restore();
  hud.textContent=str.toUpperCase()+' \u00b7 '+cl.N+'\u00d7'+cl.M+' threads \u00b7 cell '
    +cl.cell.toFixed(1)+'px \u00b7 yarn '+cl.wd.toFixed(1)+'px \u00b7 reach '
    +cl.ext.toFixed(1)+'px \u00b7 '+cl.lens.length+' crossings';
}

/* ================= chrome ================= */
const segOn=(id,attr,val)=>document.querySelectorAll('#'+id+' button')
  .forEach(b=>b.classList.toggle('on',b.dataset[attr]===val));
['str','str2'].forEach(id=>{
  document.getElementById(id).onclick=e=>{
    const b=e.target.closest('button');if(!b)return;
    snap();str=b.dataset.s;segOn('str','s',str);segOn('str2','s',str);draw();
  };
});
document.querySelectorAll('.sw').forEach(g=>{
  SWATCH.forEach(c=>{
    const b=document.createElement('button');
    b.style.background=c;b.dataset.c=c;
    if(colors[g.dataset.slot]===c)b.classList.add('on');
    b.onclick=()=>{snap();colors[g.dataset.slot]=c;
      [...g.children].forEach(x=>x.classList.toggle('on',x===b));draw();};
    g.appendChild(b);
  });
});
document.getElementById('reset').onclick=()=>{snap();Object.assign(P,DEF);syncAll();draw();};
document.getElementById('zoom').onclick=()=>{zoomed=!zoomed;fit();};

/* ================= export ================= */
function download(url,name){
  const a=document.createElement('a');a.href=url;a.download=name;
  document.body.appendChild(a);a.click();a.remove();
}
function exportPNG(){
  const sc=2,oc=document.createElement('canvas');
  oc.width=board.w*sc;oc.height=board.h*sc;
  const g=oc.getContext('2d');g.scale(sc,sc);
  renderContent(g);
  download(oc.toDataURL('image/png'),'cloth-'+str+'.png');
}
function exportSVG(){
  const cl=buildCloth(),r=P.relief/100;
  const seen={};
  let defs='',body='';
  const gradId=f=>{
    const key=f.rgb.join('_')+'_'+(f.vert?'v':'h');
    if(!seen[key]){
      seen[key]=1;
      const x2=f.vert?1:0,y2=f.vert?0:1;
      defs+='<linearGradient id="g'+key+'" x1="0" y1="0" x2="'+x2+'" y2="'+y2+'">'+
        '<stop offset="0" stop-color="'+rgbStr(mixB(f.rgb,0.17*r))+'"/>'+
        '<stop offset="0.30" stop-color="'+rgbStr(mixW(f.rgb,0.14*r))+'"/>'+
        '<stop offset="0.62" stop-color="'+rgbStr(f.rgb)+'"/>'+
        '<stop offset="1" stop-color="'+rgbStr(mixB(f.rgb,0.32*r))+'"/></linearGradient>';
    }
    return 'g'+key;
  };
  ['dv','dh'].forEach(k=>{
    const vert=k==='dv',a=(0.34*r).toFixed(3);
    defs+='<linearGradient id="'+k+'" x1="0" y1="0" x2="'+(vert?0:1)+'" y2="'+(vert?1:0)+'">'+
      '<stop offset="0" stop-color="#000" stop-opacity="'+a+'"/>'+
      '<stop offset="0.3" stop-color="#000" stop-opacity="0"/>'+
      '<stop offset="0.7" stop-color="#000" stop-opacity="0"/>'+
      '<stop offset="1" stop-color="#000" stop-opacity="'+a+'"/></linearGradient>';
  });
  const rect=(f,fill)=>'<rect x="'+f.x.toFixed(2)+'" y="'+f.y.toFixed(2)+'" width="'+f.w.toFixed(2)+
    '" height="'+f.h.toFixed(2)+'" rx="'+(Math.min(f.w,f.h)/2).toFixed(2)+'" fill="'+fill+'"/>';
  const grp=list=>{
    let s='';
    list.forEach(f=>{
      if(f.w<=0||f.h<=0) return;
      s+=rect(f,'url(#'+gradId(f)+')');
      if(r>0) s+=rect(f,'url(#'+(f.vert?'dv':'dh')+')');
    });
    return s;
  };
  let clip='<clipPath id="weftcells">';
  cl.weft.forEach(f=>{clip+='<rect x="'+f.bx.toFixed(2)+'" y="'+f.by.toFixed(2)+
    '" width="'+f.bw.toFixed(2)+'" height="'+f.bh.toFixed(2)+'"/>';});
  clip+='</clipPath>';
  body=grp(cl.weft)+grp(cl.warp)+'<g clip-path="url(#weftcells)">'+grp(cl.weft)+'</g>';
  const out='<svg xmlns="http://www.w3.org/2000/svg" width="'+board.w+'" height="'+board.h+
    '" viewBox="0 0 '+board.w+' '+board.h+'">'+
    '<rect width="'+board.w+'" height="'+board.h+'" fill="'+
      rgbStr(mixB([(hexRGB(colors.warp)[0]+hexRGB(colors.weft)[0])/2,
                   (hexRGB(colors.warp)[1]+hexRGB(colors.weft)[1])/2,
                   (hexRGB(colors.warp)[2]+hexRGB(colors.weft)[2])/2],0.72))+'"/>'+
    '<defs>'+defs+clip+'</defs>'+body+'</svg>';
  download(URL.createObjectURL(new Blob([out],{type:'image/svg+xml'})),'cloth-'+str+'.svg');
}
document.getElementById('exppng').onclick=exportPNG;
document.getElementById('expsvg').onclick=exportSVG;

addEventListener('keydown',e=>{
  const tag=e.target.tagName;
  if(tag==='INPUT'||tag==='TEXTAREA') return;
  const k=e.key.toLowerCase();
  if((e.metaKey||e.ctrlKey)&&k==='z'){e.preventDefault();undo();return;}
  if(k==='e')exportPNG();
  else if(k==='s')exportSVG();
  else if(k==='z'){zoomed=!zoomed;fit();}
});
addEventListener('pointerup',()=>{armed=true;});
window.addEventListener('error',e=>{
  hud.textContent='ERROR: '+e.message+' @'+e.lineno;hud.style.color='#ff5c3a';});

syncAll();
fit();
})();
</script>
