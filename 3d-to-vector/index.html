<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>3d-to-vector</title>
    <style>
      :root { color-scheme: light; }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; font-family: ui-sans-serif, system-ui, -apple-system, sans-serif; }
      body { display: flex; height: 100vh; background: #f5f5f5; color: #111; }

      #stage {
        flex: 1;
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #ffffff;
        overflow: hidden;
      }
      /* The SVGRenderer's <svg> gets appended here */
      #stage > svg { display: block; }

      #panel {
        width: 260px;
        flex: none;
        padding: 20px;
        background: #fafafa;
        border-left: 1px solid #e5e5e5;
        display: flex;
        flex-direction: column;
        gap: 18px;
        overflow-y: auto;
      }
      #panel h1 { font-size: 13px; letter-spacing: 0.08em; text-transform: uppercase; margin: 0 0 4px; color: #888; }
      .group { display: flex; flex-direction: column; gap: 6px; }
      .group > label { font-size: 11px; letter-spacing: 0.04em; text-transform: uppercase; color: #999; }
      select, button {
        font: inherit;
        font-size: 13px;
        padding: 8px 10px;
        border: 1px solid #d4d4d4;
        border-radius: 6px;
        background: #fff;
        cursor: pointer;
      }
      button.primary { background: #111; color: #fff; border-color: #111; }
      button.primary:hover { background: #000; }
      .row { display: flex; gap: 8px; }
      .row > * { flex: 1; }
      .hint { font-size: 11px; color: #aaa; line-height: 1.5; }
      input[type="range"] { width: 100%; }
    </style>
  </head>
  <body>
    <div id="stage"></div>
    <aside id="panel">
      <div class="group">
        <h1>3d → vector</h1>
        <p class="hint">Drag to orbit · scroll to zoom. Export writes the current view as SVG.</p>
      </div>

      <div class="group">
        <label for="shape">Shape</label>
        <select id="shape">
          <option value="bag">Shopping bag</option>
          <option value="box">Box</option>
          <option value="cylinder">Cylinder</option>
          <option value="cone">Cone</option>
        </select>
      </div>

      <div class="group">
        <label for="mode">Fill mode</label>
        <select id="mode">
          <option value="faceted">Faceted 2.5D (flat tones)</option>
          <option value="silhouette">Silhouette (single fill)</option>
        </select>
      </div>

      <div class="group">
        <label for="palette">Palette</label>
        <select id="palette">
          <option value="mono">Mono (black + grays)</option>
          <option value="ink">Ink (near-black steps)</option>
        </select>
      </div>

      <div class="row">
        <button id="reset">Reset view</button>
      </div>
      <button id="export" class="primary">Export SVG</button>

      <p class="hint" id="status"></p>
    </aside>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
