<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Test</title>
    <style>
        body {
            background: #000;
            color: #fff;
            font-family: monospace;
            padding: 20px;
        }
        canvas {
            border: 2px solid lime;
            display: block;
            margin: 20px 0;
            max-width: 100%;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            background: lime;
            border: none;
            cursor: pointer;
        }
        .log {
            background: #222;
            padding: 10px;
            margin: 5px 0;
            border-left: 3px solid lime;
        }
        .error {
            border-left-color: red;
            color: red;
        }
    </style>
</head>
<body>
    <h1>Super Simple Test</h1>
    <div id="log"></div>
    <canvas id="c"></canvas>
    <button id="go">TRANSITION</button>

    <script>
        const log = document.getElementById('log');
        const canvas = document.getElementById('c');
        const ctx = canvas.getContext('2d');
        const btn = document.getElementById('go');
        
        function addLog(msg, isError = false) {
            const div = document.createElement('div');
            div.className = 'log' + (isError ? ' error' : '');
            div.textContent = msg;
            log.appendChild(div);
            console.log(msg);
        }
        
        addLog('Loading images...');
        
        const img1 = new Image();
        const img2 = new Image();
        let loaded = 0;
        
        function checkLoaded() {
            loaded++;
            if (loaded === 2) {
                addLog(`✓ Both images loaded!`);
                addLog(`  Image1: ${img1.width}x${img1.height}`);
                addLog(`  Image2: ${img2.width}x${img2.height}`);
                
                canvas.width = Math.min(img1.width, 800);
                canvas.height = Math.min(img1.height, 1000);
                
                ctx.drawImage(img1, 0, 0, canvas.width, canvas.height);
                addLog('✓ Canvas ready. Click button to transition.');
                btn.disabled = false;
            }
        }
        
        img1.onload = checkLoaded;
        img1.onerror = (e) => {
            addLog('✗ FAILED to load Image1.jpg', true);
            addLog('  Check: Is Image1.jpg in the same folder as this HTML file?', true);
        };
        
        img2.onload = checkLoaded;
        img2.onerror = (e) => {
            addLog('✗ FAILED to load Image2.jpg', true);
            addLog('  Check: Is Image2.jpg in the same folder as this HTML file?', true);
        };
        
        img1.src = 'Image1.jpg?' + Date.now(); // Cache bust
        img2.src = 'Image2.jpg?' + Date.now();
        
        btn.disabled = true;
        btn.onclick = () => {
            addLog('Starting transition...');
            btn.disabled = true;
            
            let progress = 0;
            const interval = setInterval(() => {
                progress += 0.01;
                
                // Draw image 1
                ctx.drawImage(img1, 0, 0, canvas.width, canvas.height);
                const data1 = ctx.getImageData(0, 0, canvas.width, canvas.height);
                
                // Draw image 2
                ctx.drawImage(img2, 0, 0, canvas.width, canvas.height);
                const data2 = ctx.getImageData(0, 0, canvas.width, canvas.height);
                
                // Mix with threshold
                const output = ctx.createImageData(canvas.width, canvas.height);
                
                for (let y = 0; y < canvas.height; y++) {
                    for (let x = 0; x < canvas.width; x++) {
                        const i = (y * canvas.width + x) * 4;
                        
                        // Simple random threshold per pixel
                        const threshold = Math.random();
                        const useImg2 = progress > threshold;
                        
                        const src = useImg2 ? data2.data : data1.data;
                        output.data[i] = src[i];
                        output.data[i+1] = src[i+1];
                        output.data[i+2] = src[i+2];
                        output.data[i+3] = 255;
                    }
                }
                
                ctx.putImageData(output, 0, 0);
                
                if (progress >= 1) {
                    clearInterval(interval);
                    addLog('✓ Transition complete!');
                    btn.disabled = false;
                    btn.textContent = 'TRANSITION AGAIN';
                }
            }, 50);
        };
        
        addLog('Waiting for images...');
    </script>
</body>
</html>
