<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proper Dithered Transition</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #111;
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
            gap: 20px;
        }
        h1 { font-size: 1.8em; }
        canvas {
            max-width: 90vw;
            max-height: 70vh;
            border-radius: 8px;
            background: #000;
        }
        .controls {
            background: #222;
            padding: 20px;
            border-radius: 8px;
            width: 100%;
            max-width: 500px;
        }
        .control-row {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 15px;
        }
        label { min-width: 80px; font-size: 0.9em; color: #aaa; }
        select, input[type="range"] { flex: 1; }
        select {
            padding: 8px;
            background: #333;
            color: white;
            border: 1px solid #444;
            border-radius: 4px;
        }
        input[type="range"] {
            height: 6px;
            -webkit-appearance: none;
            background: #444;
            border-radius: 3px;
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: #4a9eff;
            cursor: pointer;
        }
        button {
            width: 100%;
            padding: 14px;
            background: #4a9eff;
            border: none;
            border-radius: 6px;
            color: white;
            font-size: 1em;
            cursor: pointer;
            margin-top: 10px;
        }
        button:hover { background: #3a8eef; }
        .value { color: #4a9eff; min-width: 45px; text-align: right; font-weight: bold; }
        #status { text-align: center; font-size: 0.85em; color: #888; margin-top: 10px; }
    </style>
</head>
<body>
    <h1>Dithered Image Transition</h1>
    <canvas id="canvas"></canvas>
    
    <div class="controls">
        <div class="control-row">
            <label>Type:</label>
            <select id="type">
                <option value="ordered">Ordered (Bayer) - Crosshatch pattern</option>
                <option value="bluenoise">Blue Noise - Smooth distribution</option>
                <option value="random">Random - Fixed noise texture</option>
            </select>
        </div>
        <div class="control-row">
            <label>Progress:</label>
            <input type="range" id="progress" min="0" max="100" value="0">
            <span class="value" id="progressValue">0%</span>
        </div>
        <button id="animate">Animate Transition</button>
        <div id="status">Loading...</div>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const progressSlider = document.getElementById('progress');
        const progressValue = document.getElementById('progressValue');
        const typeSelect = document.getElementById('type');
        const animateBtn = document.getElementById('animate');
        const status = document.getElementById('status');
        
        let img1, img2;
        let noiseMap = null;  // Pre-generated noise map
        let isAnimating = false;
        
        // 8x8 Bayer matrix for ordered dithering
        const bayer8x8 = [
            [ 0, 32,  8, 40,  2, 34, 10, 42],
            [48, 16, 56, 24, 50, 18, 58, 26],
            [12, 44,  4, 36, 14, 46,  6, 38],
            [60, 28, 52, 20, 62, 30, 54, 22],
            [ 3, 35, 11, 43,  1, 33,  9, 41],
            [51, 19, 59, 27, 49, 17, 57, 25],
            [15, 47,  7, 39, 13, 45,  5, 37],
            [63, 31, 55, 23, 61, 29, 53, 21]
        ];
        
        // Generate a fixed noise map (same size as canvas)
        function generateNoiseMap(width, height) {
            const map = new Float32Array(width * height);
            for (let i = 0; i < map.length; i++) {
                map[i] = Math.random();
            }
            return map;
        }
        
        // Generate blue noise approximation (more evenly distributed)
        function generateBlueNoiseMap(width, height) {
            const map = new Float32Array(width * height);
            
            // Multi-scale noise combination for blue noise approximation
            for (let y = 0; y < height; y++) {
                for (let x = 0; x < width; x++) {
                    const i = y * width + x;
                    
                    // Combine multiple frequency noise
                    const n1 = Math.sin(x * 0.1 + y * 0.13) * 0.5 + 0.5;
                    const n2 = Math.sin(x * 0.23 - y * 0.17 + 50) * 0.5 + 0.5;
                    const n3 = Math.sin(x * 0.41 + y * 0.37 + 100) * 0.5 + 0.5;
                    const n4 = Math.sin(x * 0.67 - y * 0.71 + 150) * 0.5 + 0.5;
                    
                    // Add some randomness
                    const r = Math.random() * 0.3;
                    
                    map[i] = (n1 + n2 * 0.5 + n3 * 0.25 + n4 * 0.125 + r) / 2.175;
                }
            }
            return map;
        }
        
        // Load images
        function loadImages() {
            return new Promise((resolve, reject) => {
                let loaded = 0;
                
                img1 = new Image();
                img2 = new Image();
                
                const onLoad = () => {
                    loaded++;
                    if (loaded === 2) resolve();
                };
                
                img1.onload = onLoad;
                img2.onload = onLoad;
                img1.onerror = () => reject('Failed to load Image1.jpg');
                img2.onerror = () => reject('Failed to load Image2.jpg');
                
                img1.src = 'Image1.jpg';
                img2.src = 'Image2.jpg';
            });
        }
        
        // Render the transition
        function render() {
            const progress = progressSlider.value / 100;
            const type = typeSelect.value;
            
            // Draw both images to get their data
            ctx.drawImage(img1, 0, 0, canvas.width, canvas.height);
            const data1 = ctx.getImageData(0, 0, canvas.width, canvas.height);
            
            ctx.drawImage(img2, 0, 0, canvas.width, canvas.height);
            const data2 = ctx.getImageData(0, 0, canvas.width, canvas.height);
            
            const output = ctx.createImageData(canvas.width, canvas.height);
            
            for (let y = 0; y < canvas.height; y++) {
                for (let x = 0; x < canvas.width; x++) {
                    const i = y * canvas.width + x;
                    const pi = i * 4;
                    
                    let threshold;
                    
                    if (type === 'ordered') {
                        // Bayer ordered dithering - FIXED pattern
                        threshold = bayer8x8[y % 8][x % 8] / 64;
                    } else if (type === 'bluenoise') {
                        // Blue noise - FIXED pattern from pre-generated map
                        threshold = noiseMap[i];
                    } else {
                        // Random - FIXED pattern from pre-generated map
                        threshold = noiseMap[i];
                    }
                    
                    // Choose source image based on threshold
                    const useImg2 = progress > threshold;
                    const src = useImg2 ? data2.data : data1.data;
                    
                    output.data[pi] = src[pi];
                    output.data[pi + 1] = src[pi + 1];
                    output.data[pi + 2] = src[pi + 2];
                    output.data[pi + 3] = 255;
                }
            }
            
            ctx.putImageData(output, 0, 0);
        }
        
        // Animation
        function animate() {
            if (isAnimating) return;
            
            isAnimating = true;
            animateBtn.textContent = 'Animating...';
            progressSlider.value = 0;
            
            const duration = 2500; // 2.5 seconds
            const startTime = performance.now();
            
            function frame(now) {
                const elapsed = now - startTime;
                const progress = Math.min(elapsed / duration, 1);
                
                // Ease in-out
                const eased = progress < 0.5 
                    ? 2 * progress * progress 
                    : 1 - Math.pow(-2 * progress + 2, 2) / 2;
                
                progressSlider.value = eased * 100;
                progressValue.textContent = Math.round(eased * 100) + '%';
                render();
                
                if (progress < 1) {
                    requestAnimationFrame(frame);
                } else {
                    isAnimating = false;
                    animateBtn.textContent = 'Animate Again';
                }
            }
            
            requestAnimationFrame(frame);
        }
        
        // Initialize
        async function init() {
            try {
                await loadImages();
                
                // Set canvas size (scaled down for performance)
                const scale = Math.min(1, 800 / img1.width);
                canvas.width = Math.round(img1.width * scale);
                canvas.height = Math.round(img1.height * scale);
                
                // Generate noise maps
                noiseMap = generateBlueNoiseMap(canvas.width, canvas.height);
                
                status.textContent = 'Ready! Drag slider or click Animate.';
                status.style.color = '#4a9eff';
                
                // Initial render
                render();
                
            } catch (err) {
                status.textContent = 'Error: ' + err;
                status.style.color = '#f55';
            }
        }
        
        // Events
        progressSlider.addEventListener('input', () => {
            progressValue.textContent = progressSlider.value + '%';
            if (!isAnimating) render();
        });
        
        typeSelect.addEventListener('change', () => {
            // Regenerate noise map based on type
            if (typeSelect.value === 'bluenoise') {
                noiseMap = generateBlueNoiseMap(canvas.width, canvas.height);
            } else if (typeSelect.value === 'random') {
                noiseMap = generateNoiseMap(canvas.width, canvas.height);
            }
            if (!isAnimating) render();
        });
        
        animateBtn.addEventListener('click', animate);
        
        // Start
        init();
    </script>
</body>
</html>
